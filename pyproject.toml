[project]
name = "clinical-agent-mesh"
version = "0.1.0"
description = "Hierarchical multi-agent clinical assistant: a supervisor routes to isolated LangGraph specialist subgraphs over grounded public clinical corpora."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Graph + LLM
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # Retrieval
    "chromadb-client>=1.0.0",
    "rank-bm25>=0.2.2",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    # Config + validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Cross-encoder reranking pulls torch (~2GB). Kept optional so the core install
# stays light and CI does not download torch to run unit tests.
rerank = [
    "sentence-transformers>=3.3.0",
    # Declared explicitly, though it arrives via sentence-transformers anyway:
    # [tool.uv.sources] only applies to direct dependencies, and this is what
    # pins the CPU wheel instead of the 2.7GB CUDA build.
    "torch>=2.2.0",
]
# Postgres checkpointer: conversations survive restarts (replaces InMemorySaver).
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
]
observability = [
    "langfuse>=2.53.0",
]

# The reranker is a small cross-encoder that runs on CPU by design, so the default
# CUDA wheel is pure waste: it pulled 2.7GB of NVIDIA libraries and took the venv
# to 5.0GB. Pinning the CPU build keeps `--extra rerank` installable by anyone
# cloning this repo.
# Linux only. The pytorch-cpu index publishes no macOS arm64 wheels, and on Apple
# Silicon the default PyPI wheel is already CPU/MPS with no CUDA payload, so the
# pin is both unnecessary and unresolvable there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Both exclusions keep the default suite fast and hermetic: NCBI rate-limits
# keyless callers, and importing torch costs ~30s against ~4s for everything else.
addopts = "-q --strict-markers -m 'not network and not rerank and not todo'"
markers = [
    "llm: test performs a real LLM call (costs money, excluded from default run)",
    "eval: slow evaluation suite, CI-gated",
    "integration: needs a running Chroma; skipped automatically when absent",
    "network: calls a live public API; opt-in via `make test-network`",
    "rerank: needs the optional rerank extra (torch); skipped when absent",
    "todo: handoff tests for work not yet implemented; run with `make build-guideline`",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Without this, mypy treats every aliased Settings field as a required __init__
# argument and rejects the env-driven `Settings()` call.
plugins = ["pydantic.mypy"]

# rank_bm25 ships no py.typed marker. sentence_transformers lives behind the
# optional `rerank` extra, so it is absent in CI and in the default install.
[[tool.mypy.overrides]]
module = ["rank_bm25.*", "sentence_transformers.*"]
ignore_missing_imports = true
