services:

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Service names, not localhost: inside the compose network the other
      # containers are reachable by name, and Chroma's own port is 8000 even
      # though it is published on 8001 to the host.
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      MESH_CHAT_MODEL: ${MESH_CHAT_MODEL:-gpt-5-nano}
    depends_on:
      chroma:
        condition: service_healthy
      postgres:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:1.0.15
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: mesh
      POSTGRES_DB: mesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  chroma_data:
  postgres_data:
